<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Grass Fed Beef Boys"
  >

  <title>Grass Fed Beef Boys</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Franklin:wght@700;800;900&display=swap"
    rel="stylesheet"
  >

  <style>
    /* ================================
       RESET
    ================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      width: 100%;
      overflow-x: hidden;
    }

    body {
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;

      background: #f2eddf;
      color: #182218;

      font-family: "DM Sans", Arial, sans-serif;
    }

    body.modal-open {
      overflow: hidden;
    }


    /* ================================
       HEADER
    ================================= */

    .header {
      width: min(1400px, calc(100% - 80px));
      min-height: 100px;

      margin: 0 auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid rgba(24, 34, 24, 0.18);
    }

    .logo {
      width: 58px;
      height: 58px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 2px solid #182218;
      border-radius: 50%;

      font-family: "Libre Franklin", Arial, sans-serif;

      font-size: 13px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .header-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
    }


    /* ================================
       HERO
    ================================= */

    .hero {
      width: min(1400px, calc(100% - 80px));

      margin: 0 auto;

      padding: 70px 0;

      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        minmax(300px, 520px);

      gap: 70px;

      align-items: center;
    }

    .hero-copy {
      width: 100%;
      max-width: 720px;
    }

    .eyebrow {
      margin-bottom: 22px;

      color: #314a2d;

      font-size: 12px;
      font-weight: 700;

      letter-spacing: 0.24em;
    }

    h1 {
      font-family: "Libre Franklin", Arial, sans-serif;

      font-size: clamp(58px, 7vw, 118px);
      font-weight: 900;

      line-height: 0.88;

      letter-spacing: -0.065em;
    }

    .subtitle {
      max-width: 430px;

      margin-top: 30px;

      font-size: 18px;
      line-height: 1.55;
    }


    /* ================================
       SPONSOR BUTTON
    ================================= */

    .sponsor-button {
      margin-top: 30px;

      padding: 15px 24px;

      background: #182218;
      color: #f2eddf;

      border: 2px solid #182218;

      font-family: "DM Sans", Arial, sans-serif;

      font-size: 11px;
      font-weight: 700;

      letter-spacing: 0.18em;

      cursor: pointer;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
    }

    .sponsor-button:hover {
      background: transparent;
      color: #182218;

      transform: translateY(-2px);
    }

    .sponsor-button:active {
      transform: translateY(0);
    }


    /* ================================
       IMAGE
    ================================= */

    .hero-image {
      width: 100%;
      max-width: 520px;

      aspect-ratio: 4 / 5;

      justify-self: end;

      overflow: hidden;

      border-radius: 6px;
    }

    .hero-image img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;

      border: 0;
    }


    /* ================================
       FOOTER
    ================================= */

    .footer {
      width: min(1400px, calc(100% - 80px));

      min-height: 90px;

      margin: 0 auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 30px;

      border-top: 1px solid rgba(24, 34, 24, 0.18);

      font-size: 11px;
      font-weight: 700;

      letter-spacing: 0.16em;
    }


    /* ================================
       POPUP
    ================================= */

    .modal-overlay {
      position: fixed;

      inset: 0;

      z-index: 1000;

      padding: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(24, 34, 24, 0.75);

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transition:
        opacity 0.2s ease,
        visibility 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .modal {
      position: relative;

      width: min(500px, 100%);

      padding: 60px 45px 45px;

      background: #f2eddf;

      border: 2px solid #182218;

      text-align: center;

      transform: translateY(15px);

      transition: transform 0.2s ease;
    }

    .modal-overlay.active .modal {
      transform: translateY(0);
    }

    .modal-close {
      position: absolute;

      top: 12px;
      right: 17px;

      background: none;
      border: none;

      color: #182218;

      font-size: 32px;
      line-height: 1;

      cursor: pointer;
    }

    .modal-eyebrow {
      margin-bottom: 18px;

      color: #314a2d;

      font-size: 10px;
      font-weight: 700;

      letter-spacing: 0.22em;
    }

    .modal h2 {
      font-family: "Libre Franklin", Arial, sans-serif;

      font-size: clamp(38px, 7vw, 58px);

      font-weight: 900;

      line-height: 0.98;

      letter-spacing: -0.05em;
    }

    .modal-button {
      width: auto;

      margin-top: 32px;

      padding: 14px 22px;

      background: #182218;
      color: #f2eddf;

      border: 2px solid #182218;

      font-family: "DM Sans", Arial, sans-serif;

      font-size: 10px;
      font-weight: 700;

      letter-spacing: 0.17em;

      cursor: pointer;
    }

    .modal-button:hover {
      background: transparent;
      color: #182218;
    }


    /* ================================
       TABLET
    ================================= */

    @media (max-width: 900px) {

      .header,
      .hero,
      .footer {
        width: calc(100% - 40px);
      }

      .hero {
        grid-template-columns: 1fr;

        gap: 45px;

        padding: 55px 0;
      }

      .hero-copy {
        max-width: 100%;
      }

      h1 {
        font-size: clamp(54px, 11vw, 90px);
      }

      .hero-image {
        width: min(100%, 540px);

        max-width: 540px;

        justify-self: start;
      }
    }


    /* ================================
       MOBILE
    ================================= */

    @media (max-width: 600px) {

      .header,
      .hero,
      .footer {
        width: calc(100% - 28px);
      }

      .header {
        min-height: 78px;
      }

      .logo {
        width: 48px;
        height: 48px;

        font-size: 11px;
      }

      .header-label {
        font-size: 9px;
      }

      .hero {
        display: block;

        padding: 40px 0;
      }

      .hero-copy {
        width: 100%;

        margin-bottom: 32px;
      }

      .eyebrow {
        margin-bottom: 15px;

        font-size: 10px;
      }

      h1 {
        width: 100%;

        font-size: clamp(44px, 14.5vw, 68px);

        line-height: 0.91;

        letter-spacing: -0.055em;
      }

      .subtitle {
        width: 100%;

        margin-top: 23px;

        font-size: 16px;
        line-height: 1.5;
      }

      .sponsor-button {
        width: 100%;

        margin-top: 24px;

        padding: 16px 20px;
      }

      .hero-image {
        width: 100%;

        max-width: 100%;

        aspect-ratio: 4 / 5;

        border-radius: 5px;
      }

      .hero-image img {
        width: 100%;
        height: 100%;

        object-fit: cover;
      }

      .footer {
        min-height: auto;

        padding: 22px 0;

        flex-direction: column;

        align-items: flex-start;

        gap: 8px;

        font-size: 9px;
      }

      .modal {
        padding: 55px 25px 35px;
      }

      .modal h2 {
        font-size: 40px;
      }

      .modal-button {
        width: 100%;
      }
    }


    /* ================================
       VERY SMALL PHONES
    ================================= */

    @media (max-width: 380px) {

      h1 {
        font-size: 41px;
      }

      .subtitle {
        font-size: 15px;
      }

      .modal h2 {
        font-size: 35px;
      }
    }

  </style>
</head>


<body>

  <header class="header">

    <div class="logo">
      GFBB
    </div>

    <div class="header-label">
      EST. 2026
    </div>

  </header>


  <main class="hero">

    <section class="hero-copy">

      <p class="eyebrow">
        100% GRASS FED
      </p>

      <h1>
        GRASS FED<br>
        BEEF BOYS
      </h1>

      <p class="subtitle">
        Good beef. Good people. No nonsense.
      </p>

      <button
        class="sponsor-button"
        id="sponsorButton"
        type="button"
      >
        SPONSOR US
      </button>

    </section>


    <section class="hero-image">

      <img
        src="./img_1611_1024.jpg"
        alt="Grass Fed Beef Boys"
      >

    </section>

  </main>


  <footer class="footer">

    <p>
      GRASS FED BEEF BOYS
    </p>

    <p>
      THE GOOD STUFF.
    </p>

  </footer>


  <div
    class="modal-overlay"
    id="modalOverlay"
    aria-hidden="true"
  >

    <div
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >

      <button
        class="modal-close"
        id="modalClose"
        type="button"
        aria-label="Close"
      >
        ×
      </button>

      <p class="modal-eyebrow">
        SPONSORSHIP INQUIRY
      </p>

      <h2 id="modalTitle">
        just kidding...
        <br>
        unless?
      </h2>

      <button
        class="modal-button"
        id="modalButton"
        type="button"
      >
        CARRY ON
      </button>

    </div>

  </div>


  <script>

    const sponsorButton =
      document.getElementById("sponsorButton");

    const modalOverlay =
      document.getElementById("modalOverlay");

    const modalClose =
      document.getElementById("modalClose");

    const modalButton =
      document.getElementById("modalButton");


    function openModal() {
      modalOverlay.classList.add("active");

      modalOverlay.setAttribute(
        "aria-hidden",
        "false"
      );

      document.body.classList.add(
        "modal-open"
      );
    }


    function closeModal() {
      modalOverlay.classList.remove("active");

      modalOverlay.setAttribute(
        "aria-hidden",
        "true"
      );

      document.body.classList.remove(
        "modal-open"
      );
    }


    sponsorButton.addEventListener(
      "click",
      openModal
    );


    modalClose.addEventListener(
      "click",
      closeModal
    );


    modalButton.addEventListener(
      "click",
      closeModal
    );


    modalOverlay.addEventListener(
      "click",
      function(event) {

        if (event.target === modalOverlay) {
          closeModal();
        }

      }
    );


    document.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Escape") {
          closeModal();
        }

      }
    );

  </script>

</body>
</html>
